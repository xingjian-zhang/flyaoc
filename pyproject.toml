[project]
name = "flyaoc-review"
version = "0.1.0"
description = "Anonymous NeurIPS review artifact for FlyAOC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "goatools>=1.4.12",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
flyaoc-smoke-test = "flyaoc.reporting.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyaoc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
